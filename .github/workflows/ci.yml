name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: payfast_test
          MYSQL_USER: payfast_test
          MYSQL_PASSWORD: payfast_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: payfast_test
      DB_PASSWORD: payfast_test_password
      DB_NAME: payfast_test
      GHL_CLIENT_ID: test_client_id
      GHL_CLIENT_SECRET: test_client_secret
      AGENCY_GHL_CLIENT_ID: test_agency_client_id
      AGENCY_GHL_CLIENT_SECRET: test_agency_client_secret
      WHOP_GHL_CLIENT_ID: test_whop_client_id
      WHOP_GHL_CLIENT_SECRET: test_whop_client_secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: test_session_secret_at_least_32_chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 -upayfast_test -ppayfast_test_password &>/dev/null && break || sleep 1
          done

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
