name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: payfast_test
  DB_PASSWORD: payfast_test_password
  DB_NAME: payfast_test
  GHL_CLIENT_ID: test_client_id
  GHL_CLIENT_SECRET: test_client_secret
  PAYFAST_GHL_CLIENT_ID: test_payfast_client
  PAYFAST_GHL_CLIENT_SECRET: test_payfast_secret
  WHOP_GHL_CLIENT_ID: test_whop_client
  WHOP_GHL_CLIENT_SECRET: test_whop_secret
  SWICH_GHL_CLIENT_ID: test_swich_client
  SWICH_GHL_CLIENT_SECRET: test_swich_secret
  AGENCY_GHL_CLIENT_ID: test_agency_client_id
  AGENCY_GHL_CLIENT_SECRET: test_agency_client_secret
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  SESSION_SECRET: test_session_secret_at_least_32_chars

jobs:
  verify-rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone rollout files
        run: node scripts/verify-gateway-rollout.mjs --ci

  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: payfast_test
          MYSQL_USER: payfast_test
          MYSQL_PASSWORD: payfast_test_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do mysqladmin ping -h127.0.0.1 -P3306 -upayfast_test -ppayfast_test_password &>/dev/null && break || sleep 1; done
      - name: Initialize database schema
        shell: bash
        run: |
          for migration in scripts/setup.sql scripts/agency-billing.sql scripts/suspension-adapter.sql scripts/wallet_tokenization.sql; do
            sed -e 's/payfast_ghl/payfast_test/g' -e 's/ADD COLUMN IF NOT EXISTS/ADD COLUMN/g' "$migration" > current-migration.sql
            mysql -h127.0.0.1 -P3306 -upayfast_test -ppayfast_test_password payfast_test < current-migration.sql
          done
          mysql -h127.0.0.1 -P3306 -upayfast_test -ppayfast_test_password payfast_test <<'SQL'
          ALTER TABLE location_subscriptions ADD COLUMN provider VARCHAR(20) DEFAULT 'payfast' AFTER plan_id;
          ALTER TABLE payment_instruments ADD COLUMN contact_id VARCHAR(100) NULL AFTER location_id, ADD COLUMN provider VARCHAR(20) NOT NULL DEFAULT 'payfast' AFTER contact_id, ADD COLUMN provider_customer_id VARCHAR(120) NULL AFTER provider, ADD COLUMN provider_payment_method_id VARCHAR(120) NULL AFTER provider_customer_id;
          ALTER TABLE payments ADD COLUMN custom_str3 VARCHAR(255) NULL AFTER custom_str2, ADD COLUMN provider VARCHAR(20) DEFAULT 'payfast' AFTER payment_type;
          ALTER TABLE agency_settings
            ADD COLUMN sandbox_merchant_id VARCHAR(100) NULL, ADD COLUMN sandbox_merchant_key VARCHAR(255) NULL, ADD COLUMN sandbox_merchant_name VARCHAR(200) NULL,
            ADD COLUMN sandbox_store_id VARCHAR(100) NULL, ADD COLUMN sandbox_passphrase VARCHAR(255) NULL,
            ADD COLUMN swich_live_client_id VARCHAR(150) NULL, ADD COLUMN swich_live_secret_key VARCHAR(255) NULL, ADD COLUMN swich_live_checkout_url VARCHAR(1000) NULL,
            ADD COLUMN swich_sandbox_client_id VARCHAR(150) NULL, ADD COLUMN swich_sandbox_secret_key VARCHAR(255) NULL, ADD COLUMN swich_sandbox_checkout_url VARCHAR(1000) NULL,
            ADD COLUMN route_subscription VARCHAR(20) DEFAULT 'payfast', ADD COLUMN whop_api_key VARCHAR(255) NULL, ADD COLUMN whop_company_id VARCHAR(100) NULL,
            ADD COLUMN whop_webhook_secret VARCHAR(255) NULL, ADD COLUMN whop_exchange_rate DECIMAL(12,4) DEFAULT 280, ADD COLUMN whop_fee_percent DECIMAL(8,4) DEFAULT 0,
            ADD COLUMN whop_rate_mode VARCHAR(20) DEFAULT 'fixed', ADD COLUMN whop_currency VARCHAR(10) DEFAULT 'PKR';
          ALTER TABLE billing_invoices ADD COLUMN provider VARCHAR(20) NOT NULL DEFAULT 'payfast' AFTER payment_id;
          SQL
      - run: npm test -- --runInBand

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
