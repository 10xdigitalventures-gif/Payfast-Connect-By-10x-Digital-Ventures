name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: payfast_test
          MYSQL_USER: payfast_test
          MYSQL_PASSWORD: payfast_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: payfast_test
      DB_PASSWORD: payfast_test_password
      DB_NAME: payfast_test
      GHL_CLIENT_ID: test_client_id
      GHL_CLIENT_SECRET: test_client_secret
      AGENCY_GHL_CLIENT_ID: test_agency_client_id
      AGENCY_GHL_CLIENT_SECRET: test_agency_client_secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: test_session_secret_at_least_32_chars
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@v4
        with:
          ref: fix/patch-vulnerabilities-99d54e8d-1789187233
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize dependency lockfile"
            git push origin HEAD:fix/patch-vulnerabilities-99d54e8d-1789187233
          fi
      - name: Install dependencies
        run: npm ci
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 -upayfast_test -ppayfast_test_password &>/dev/null && break || sleep 1
          done
      - name: Initialize database schema
        shell: bash
        run: |
          for migration in scripts/setup.sql scripts/agency-billing.sql scripts/suspension-adapter.sql scripts/wallet_tokenization.sql; do
            sed -e 's/payfast_ghl/payfast_test/g' -e 's/ADD COLUMN IF NOT EXISTS/ADD COLUMN/g' "$migration" > current-migration.sql
            mysql -h127.0.0.1 -P3306 -upayfast_test -ppayfast_test_password payfast_test < current-migration.sql
          done
          mysql -h127.0.0.1 -P3306 -upayfast_test -ppayfast_test_password payfast_test <<'SQL'
          ALTER TABLE location_subscriptions ADD COLUMN provider VARCHAR(20) DEFAULT 'payfast' AFTER plan_id;
          ALTER TABLE payment_instruments
            ADD COLUMN contact_id VARCHAR(100) NULL AFTER location_id,
            ADD COLUMN provider VARCHAR(20) NOT NULL DEFAULT 'payfast' AFTER contact_id,
            ADD COLUMN provider_customer_id VARCHAR(120) NULL AFTER provider,
            ADD COLUMN provider_payment_method_id VARCHAR(120) NULL AFTER provider_customer_id;
          ALTER TABLE payments
            ADD COLUMN custom_str3 VARCHAR(255) NULL AFTER custom_str2,
            ADD COLUMN provider VARCHAR(20) DEFAULT 'payfast' AFTER payment_type;
          SQL
      - name: Run tests
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
