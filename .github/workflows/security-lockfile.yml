name: Refresh security dependency lockfile

on:
  push:
    branches: [ security/dependency-audit-2026-11 ]

permissions:
  contents: read

jobs:
  lockfile:
    if: contains(github.event.head_commit.message, '[refresh-security-lockfile]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve supported framework versions and security fixes
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts || true
          npm install --package-lock-only --ignore-scripts --no-audit
          git diff --check
      - name: Commit regenerated package-lock.json to security branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(security): regenerate npm lockfile for patched Next.js stack'
            git push origin HEAD:security/dependency-audit-2026-11
          fi
